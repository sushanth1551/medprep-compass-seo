<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}MedPrep Compass{% endblock %}</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f6f7f9; color: #1d2330; }
  main { max-width: 960px; margin: 0 auto; padding: 24px 16px 64px; }
  header { background: #123b5e; color: #fff; padding: 14px 16px; }
  header a { color: #fff; text-decoration: none; font-weight: 600; }
  .card { background: #fff; border: 1px solid #dde1e7; border-radius: 8px; padding: 16px 20px; margin: 16px 0; }
  label { display: block; font-weight: 600; margin-top: 12px; }
  input[type=text], select { width: 100%; padding: 8px; font-size: 1rem; box-sizing: border-box; }
  button, .button { background: #123b5e; color: #fff; border: 0; border-radius: 6px; padding: 10px 18px;
    font-size: 1rem; cursor: pointer; text-decoration: none; display: inline-block; }
  button:disabled { opacity: .6; cursor: wait; }
  .error { background: #fde8e8; border: 1px solid #e0a3a3; padding: 10px 14px; border-radius: 6px; }
  .notice { background: #fff6dd; border: 1px solid #e2c875; padding: 10px 14px; border-radius: 6px; }
  .muted { color: #777; } .steps { margin: 0; padding-left: 20px; }
  button.secondary { background: #fff; color: #123b5e; border: 1px solid #123b5e; padding: 6px 12px; font-size: .9rem; }
  .article-body h4 { margin: 12px 0 4px; }
  .ok { color: #1a6b35; } .warn { color: #8a5a00; } .fail { color: #a11d1d; }
  table { border-collapse: collapse; } td, th { padding: 4px 12px 4px 0; text-align: left; vertical-align: top; }
  .body { white-space: pre-wrap; }
  code { background: #eef0f3; padding: 1px 4px; border-radius: 4px; }
</style>
</head>
<body>
<header><a href="/">MedPrep Compass — SEO draft generator</a></header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
